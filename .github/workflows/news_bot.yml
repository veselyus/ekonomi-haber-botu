name: Economy & Banking News Bot

on:
  schedule:
    # Sabah Bülteni Yedekli Tetikleme Dizisi (07:46, 07:54, 08:03, 08:12, 08:22, 08:37 TSİ)
    # Tam saat başı (:00/:30) yoğunluğundan kaçınır. İlk başarılı çalışma bülteni gönderip
    # SQLite kilidini yazar; sonraki yedek tetiklemeler RSS/Gemini harcamadan 1 sn'de kapanır.
    - cron: "46,54 4 * * *"
    - cron: "3,12,22,37 5 * * *"
    # Gün içi stratejik kontroller: 11:07 TSİ (TÜİK sonrası), 15:07 TSİ (TCMB/ECB sonrası), 22:37 TSİ (Fed/Not kararları sonrası)
    # Gün içindeki bu 3 kontrolde normal haberler sessizce ertesi sabah bültenine biriktirilir;
    # yalnızca 10/10 puanlık olağanüstü kritik bir karar varsa anında alarm gönderilir.
    - cron: "7 8,12 * * *"
    - cron: "37 19 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        required: true
        default: "both"
        type: choice
        options:
          - auto
          - both
          - scan
          - digest
          - fetch-preview
      dry_run:
        description: "Dry-run (Telegram'a göndermeden sadece loglarda önizle)"
        required: false
        default: false
        type: boolean
      reset_state:
        description: "Hafızayı sıfırla (Test için önceki gönderilenleri unut ve son 24 saati baştan derle)"
        required: false
        default: false
        type: boolean

# Aynı anda iki zamanlanmış işin SQLite önbelleğini ezmesini engeller
concurrency:
  group: news-bot-state
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: SQLite Durum Veritabanını Önbellekten Geri Yükle
        if: inputs.reset_state != true
        uses: actions/cache/restore@v4
        with:
          path: data
          key: news-bot-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-bot-sqlite-

      - name: Haber Botunu Çalıştır
        id: run-bot-step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}"
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ "${{ inputs.reset_state }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --reset-state"
          fi
          mkdir -p data
          BEFORE_HASH=""
          if [ -f data/news_state.db ]; then
            BEFORE_HASH=$(sha256sum data/news_state.db | awk '{print $1}')
          fi
          python main.py --mode "$MODE" $EXTRA_FLAGS
          AFTER_HASH=""
          if [ -f data/news_state.db ]; then
            AFTER_HASH=$(sha256sum data/news_state.db | awk '{print $1}')
          fi
          if [ "$BEFORE_HASH" != "$AFTER_HASH" ]; then
            echo "db_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "db_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Güncel SQLite Veritabanını Önbelleğe Kaydet
        if: always() && inputs.dry_run != true && steps.run-bot-step.outputs.db_changed != 'false'
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-bot-sqlite-${{ github.run_id }}-${{ github.run_attempt }}


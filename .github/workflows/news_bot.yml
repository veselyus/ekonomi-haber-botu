name: Economy & Banking News Bot

on:
  schedule:
    # 08:00 TSİ (05:00 UTC) -> Günlük Tek Sabah Bülteni (7-9 puanlık biriken tüm önemli haberler) + Tarama
    - cron: "0 5 * * *"
    # 11:00 TSİ (TÜİK verileri sonrası), 15:00 TSİ (TCMB/ECB sonrası), 22:30 TSİ (Fed/Not kararları sonrası)
    # Gün içindeki bu 3 kontrolde normal haberler sessizce ertesi sabah 08:00 bültenine biriktirilir;
    # yalnızca 10/10 puanlık olağanüstü kritik bir karar varsa anında alarm gönderilir.
    - cron: "0 8,12 * * *"
    - cron: "30 19 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Çalışma modu"
        required: true
        default: "both"
        type: choice
        options:
          - auto
          - both
          - scan
          - digest
          - fetch-preview
      dry_run:
        description: "Dry-run (Telegram'a göndermeden sadece loglarda önizle)"
        required: false
        default: false
        type: boolean

# Aynı anda iki zamanlanmış işin SQLite önbelleğini ezmesini engeller
concurrency:
  group: news-bot-state
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Bağımlılıkları Yükle
        run: pip install -r requirements.txt

      - name: SQLite Durum Veritabanını Önbellekten Geri Yükle
        uses: actions/cache/restore@v4
        with:
          path: data
          key: news-bot-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            news-bot-sqlite-

      - name: Haber Botunu Çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          PYTHONUNBUFFERED: "1"
        run: |
          MODE="${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}"
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          mkdir -p data
          python main.py --mode "$MODE" $DRY_FLAG

      - name: Güncel SQLite Veritabanını Önbelleğe Kaydet
        if: always() && inputs.dry_run != true
        uses: actions/cache/save@v4
        with:
          path: data
          key: news-bot-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

